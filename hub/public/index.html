<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetaManager hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🗂️</span> MetaManager <span class="muted">hub</span></div>
    <div class="search-wrap">
      <input id="global-search" type="search" placeholder="Search any asset — BM, ad account, page, pixel, person…" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <nav class="tabs">
      <a class="tab" href="#overview">Overview</a>
      <a class="tab" href="#tree">Tree</a>
    </nav>
  </header>

  <div class="crumbs" id="crumbs"></div>
  <main id="app"></main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
