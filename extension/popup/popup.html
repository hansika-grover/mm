<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root{--bg:#0e1116;--panel:#161b22;--line:#2a323d;--txt:#e6edf3;--muted:#8b97a5;--accent:#4c9ffe;--green:#3fb950;--red:#f85149;--yellow:#d29922}
    *{box-sizing:border-box}
    body{width:360px;margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
    header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
    header .logo{font-size:18px} header b{font-size:14px} header .muted{color:var(--muted)}
    .body{padding:12px 14px}
    .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
    .row .k{color:var(--muted)}
    .pill{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
    .ok{background:rgba(63,185,80,.16);color:#57d364}
    .bad{background:rgba(248,81,73,.16);color:#ff7b72}
    .warn{background:rgba(210,153,34,.16);color:#e3b341}
    .info{background:rgba(76,159,254,.16);color:#79c0ff}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0}
    button{width:100%;padding:9px;border:none;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
    .primary{background:var(--accent);color:#04101f}
    .ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
    .hint{color:var(--muted);font-size:12px;margin:8px 0 0}
    a{color:var(--accent)} .mono{font-family:ui-monospace,Consolas,monospace}
    #msg{min-height:16px;color:var(--muted);font-size:12px;margin-top:8px}
    #msg.err{color:#ff7b72} #msg.ok{color:#57d364}
    .prog{margin-top:12px}
    .prog .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
    .prog #bar-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
    .prog.done #bar-fill{background:var(--green)} .prog.error #bar-fill{background:var(--red)}
    .prog #prog-label{font-size:12px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:8px}
    .prog #prog-label .pct{font-family:ui-monospace,Consolas,monospace}
  </style>
</head>
<body>
  <header><span class="logo">🗂️</span><b>fbacc</b> <span class="muted">extractor</span></header>
  <div class="body">
    <div class="card">
      <div class="row"><span class="k">Session token</span><span id="s-tok" class="pill warn">checking…</span></div>
      <div class="row"><span class="k">Logged-in user</span><span id="s-uid" class="mono">—</span></div>
      <div class="row"><span class="k">Hub</span><span id="s-hub" class="pill info mono">—</span></div>
    </div>

    <button id="extract" class="primary">Extract &amp; send to hub</button>
    <button id="refresh" class="ghost">Refresh session</button>

    <div id="prog" class="prog" hidden>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="prog-label"></div>
    </div>
    <div id="msg"></div>

    <div class="card" id="result-card" style="display:none">
      <div class="row"><span class="k">Last extract</span><span id="r-stats" class="mono"></span></div>
      <div class="row"><span class="k">Last send</span><span id="r-send" class="pill">—</span></div>
    </div>

    <p class="hint">One click, from any Facebook tab (Ads Manager / business.facebook.com) — no need to open every settings page. It reads your live session and pulls the full tree. <a href="#" id="opts">Settings</a></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
